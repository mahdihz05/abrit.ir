services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abrit_payload
      POSTGRES_USER: abrit
      POSTGRES_PASSWORD: abrit
    ports:
      - "5433:5432"
    volumes:
      - abrit_payload_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrit -d abrit_payload"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abrit_payload_postgres:
