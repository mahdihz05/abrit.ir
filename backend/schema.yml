openapi: 3.0.3
info:
  title: AbrIT Public API
  version: 1.0.0
  description: Published multilingual content, navigation, forms and pricing for AbrIT.
paths:
  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - auth_login_failure
          - auth_login_success
          - auth_logout
          - publish
          - restore
          - retention_purge
          - unpublish
          - user_activate
          - user_create
          - user_deactivate
          - user_password_reset
          - user_role_change
          - user_update
      - in: query
        name: actor_id
        schema:
          type: integer
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - admin
          - agent
          - api
          - mcp
          - system
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -timestamp
          - timestamp
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (1-100).
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudit'
          description: ''
  /api/v1/admin/audit/{audit_id}:
    get:
      operationId: admin_audit_detail
      parameters:
      - in: path
        name: audit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditDetailResponse'
          description: ''
  /api/v1/admin/auth/csrf:
    get:
      operationId: admin_auth_csrf
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          description: ''
  /api/v1/admin/auth/login:
    post:
      operationId: admin_auth_login
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
  /api/v1/admin/auth/logout:
    post:
      operationId: admin_auth_logout
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/admin/auth/session:
    get:
      operationId: admin_auth_session
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
  /api/v1/admin/dashboard:
    get:
      operationId: admin_dashboard
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
  /api/v1/admin/permissions:
    get:
      operationId: admin_permission_catalog_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
          description: ''
  /api/v1/admin/roles:
    get:
      operationId: admin_role_catalog_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
          description: ''
  /api/v1/admin/roles/{key}:
    get:
      operationId: admin_role_catalog_detail
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
          description: ''
  /api/v1/admin/users:
    get:
      operationId: admin_user_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUser'
          description: ''
    post:
      operationId: admin_user_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/admin/users/{user_id}:
    get:
      operationId: admin_user_detail
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
    patch:
      operationId: admin_user_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserPatch'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/admin/users/{user_id}/activate:
    post:
      operationId: admin_user_activate
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/admin/users/{user_id}/deactivate:
    post:
      operationId: admin_user_deactivate
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/admin/users/{user_id}/password:
    post:
      operationId: admin_user_password
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Password'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Password'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Password'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangedResponse'
          description: ''
  /api/v1/content/{locale}/{path}:
    get:
      operationId: content_detail
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      - in: path
        name: path
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
          description: ''
  /api/v1/content/{locale}/root:
    get:
      operationId: content_root
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
          description: ''
  /api/v1/content/collections/{kind}/{locale}:
    get:
      operationId: content_list
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: locale
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSummary'
          description: ''
  /api/v1/forms/{form_key}/submissions:
    post:
      operationId: v1_forms_submissions_create
      parameters:
      - in: path
        name: form_key
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFormSubmission'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicFormSubmission'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicFormSubmission'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFormSubmission'
          description: ''
  /api/v1/navigation/{location}/{locale}:
    get:
      operationId: navigation
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      - in: path
        name: location
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
  /api/v1/pricing/calculate:
    post:
      operationId: pricing_calculate
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingRequest'
          description: ''
  /api/v1/pricing/packages:
    get:
      operationId: package_list
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          description: ''
  /api/v1/search:
    get:
      operationId: search
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
          description: ''
  /api/v1/site/settings:
    get:
      operationId: site_settings
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
components:
  schemas:
    AuditActor:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
    AuditDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
        actor_type:
          type: string
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        before: {}
        after: {}
        metadata: {}
      required:
      - action
      - actor
      - actor_type
      - after
      - before
      - id
      - metadata
      - object_id
      - object_type
      - timestamp
    AuditDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuditDetail'
      required:
      - data
    AuditPageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required:
      - page
      - page_size
      - total
      - total_pages
    AuditSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
        actor_type:
          type: string
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
      required:
      - action
      - actor
      - actor_type
      - id
      - object_id
      - object_type
      - timestamp
    ChangedResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: boolean
      required:
      - data
    ContentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
        kind:
          type: string
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 180
        url:
          type: string
        excerpt:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        blocks:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        seo:
          type: object
          additionalProperties: {}
          readOnly: true
        alternates:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - alternates
      - blocks
      - id
      - key
      - kind
      - locale
      - seo
      - slug
      - title
      - url
    ContentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
        kind:
          type: string
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 180
        url:
          type: string
        excerpt:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - key
      - kind
      - locale
      - slug
      - title
      - url
    CsrfData:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CsrfResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CsrfData'
      required:
      - data
    DashboardContent:
      type: object
      properties:
        draft:
          type: integer
        review:
          type: integer
        scheduled:
          type: integer
        published:
          type: integer
        archived:
          type: integer
      required:
      - archived
      - draft
      - published
      - review
      - scheduled
    DashboardData:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        users:
          $ref: '#/components/schemas/DashboardUsers'
        content:
          $ref: '#/components/schemas/DashboardContent'
        submissions:
          $ref: '#/components/schemas/DashboardSubmissions'
        revalidation:
          $ref: '#/components/schemas/DashboardRevalidation'
      required:
      - content
      - generated_at
      - revalidation
      - submissions
      - users
    DashboardResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DashboardData'
      required:
      - data
    DashboardRevalidation:
      type: object
      properties:
        pending:
          type: integer
        failed:
          type: integer
      required:
      - failed
      - pending
    DashboardSubmissions:
      type: object
      properties:
        new:
          type: integer
      required:
      - new
    DashboardUsers:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        locked:
          type: integer
      required:
      - active
      - locked
      - total
    EmptyResponse:
      type: object
      properties:
        data:
          nullable: true
      required:
      - data
    LocaleEnum:
      enum:
      - fa
      - en
      - ar-ae
      type: string
      description: |-
        * `fa` - فارسی
        * `en` - English
        * `ar-ae` - العربية
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    NavigationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        url:
          type: string
        icon:
          type: string
        column:
          type: integer
        open_in_new_tab:
          type: boolean
        featured_image:
          type: string
          nullable: true
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - children
      - column
      - description
      - featured_image
      - icon
      - id
      - open_in_new_tab
      - title
      - url
    Package:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          readOnly: true
        audience:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        base_monthly_toman:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        currency:
          type: string
          readOnly: true
        included_users:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_endpoints:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_servers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_sites:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sla:
          type: string
          readOnly: true
        addon_rates:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        is_featured:
          type: boolean
      required:
      - addon_rates
      - audience
      - base_monthly_toman
      - currency
      - description
      - included_endpoints
      - included_users
      - key
      - name
      - order
      - sla
    PaginatedAudit:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditSummary'
        meta:
          $ref: '#/components/schemas/AuditPageMeta'
      required:
      - data
      - meta
    PaginatedUser:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/UserPageMeta'
      required:
      - data
      - meta
    Password:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    PatchedUserPatch:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          type: string
          nullable: true
    PermissionDefinition:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        category:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - category
      - key
      - label
      - source
    PermissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'
      required:
      - data
    PricingRequest:
      type: object
      properties:
        package:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        term_months:
          $ref: '#/components/schemas/TermMonthsEnum'
        users:
          type: integer
          maximum: 10000
          minimum: 0
        endpoints:
          type: integer
          maximum: 10000
          minimum: 0
      required:
      - endpoints
      - package
      - term_months
      - users
    PublicFormSubmission:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/PublicFormSubmissionLocaleEnum'
        data:
          type: object
          additionalProperties: {}
        consent_given:
          type: boolean
        source_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        referrer:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        website:
          type: string
