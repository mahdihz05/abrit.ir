openapi: 3.0.3
info:
  title: AbrIT Public API
  version: 1.0.0
  description: Published multilingual content, navigation, forms and pricing for AbrIT.
paths:
  /api/v1/content/{kind}/{locale}:
    get:
      operationId: content_list
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: locale
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSummary'
          description: ''
  /api/v1/content/{locale}/{path}:
    get:
      operationId: content_detail
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      - in: path
        name: path
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
          description: ''
  /api/v1/content/{locale}/root:
    get:
      operationId: content_root
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
          description: ''
  /api/v1/navigation/{location}/{locale}:
    get:
      operationId: navigation
      parameters:
      - in: path
        name: locale
        schema:
          type: string
        required: true
      - in: path
        name: location
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
  /api/v1/pricing/calculate:
    post:
      operationId: pricing_calculate
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingRequest'
          description: ''
  /api/v1/pricing/packages:
    get:
      operationId: package_list
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          description: ''
  /api/v1/search:
    get:
      operationId: search
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
          description: ''
  /api/v1/site/settings:
    get:
      operationId: site_settings
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
components:
  schemas:
    ContentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
        kind:
          type: string
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 180
        url:
          type: string
        excerpt:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        blocks:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        seo:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - blocks
      - id
      - key
      - kind
      - locale
      - seo
      - slug
      - title
      - url
    ContentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
        kind:
          type: string
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 180
        url:
          type: string
        excerpt:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - key
      - kind
      - locale
      - slug
      - title
      - url
    LocaleEnum:
      enum:
      - fa
      - en
      - ar-ae
      type: string
      description: |-
        * `fa` - فارسی
        * `en` - English
        * `ar-ae` - العربية
    NavigationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        url:
          type: string
        icon:
          type: string
        column:
          type: integer
        open_in_new_tab:
          type: boolean
        featured_image:
          type: string
          nullable: true
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - children
      - column
      - description
      - featured_image
      - icon
      - id
      - open_in_new_tab
      - title
      - url
    Package:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          readOnly: true
        audience:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        base_monthly_toman:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        currency:
          type: string
          readOnly: true
        included_users:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_endpoints:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_servers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        included_sites:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sla:
          type: string
          readOnly: true
        addon_rates:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        is_featured:
          type: boolean
      required:
      - addon_rates
      - audience
      - base_monthly_toman
      - currency
      - description
      - included_endpoints
      - included_users
      - key
      - name
      - order
      - sla
    PricingRequest:
      type: object
      properties:
        package:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        term_months:
          $ref: '#/components/schemas/TermMonthsEnum'
        users:
          type: integer
          maximum: 10000
          minimum: 0
        endpoints:
          type: integer
          maximum: 10000
          minimum: 0
      required:
      - endpoints
      - package
      - term_months
      - users
    SearchResult:
      type: object
      properties:
        kind:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
      required:
      - kind
      - summary
      - title
      - url
    SiteSettings:
      type: object
      properties:
        brand_name:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 40
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        default_locale:
          $ref: '#/components/schemas/LocaleEnum'
        customer_portal_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        external_checkout_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        social_links: {}
        location:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        seo:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        logo_url:
          type: string
          nullable: true
          readOnly: true
        favicon_url:
          type: string
          nullable: true
          readOnly: true
        design_tokens:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - address
      - design_tokens
      - favicon_url
      - location
      - logo_url
      - seo
    TermMonthsEnum:
      enum:
      - 3
      - 6
      - 12
      type: integer
      description: |-
        * `3` - 3
        * `6` - 6
        * `12` - 12
