name: abrit-payload

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env.production
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  builder:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /workspace/frontend
    env_file:
      - path: .env.production
        required: false
    command: ["sh", "-c", "npm ci && npm run migrate && npm run build"]
    volumes:
      - ..:/workspace
      - node_modules:/workspace/frontend/node_modules
      - npm_cache:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: .env.production
        required: false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - media:/app/media
      - private_media:/app/private-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  node_modules:
  npm_cache:
  media:
  private_media:
